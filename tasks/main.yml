---
# CrowdSec Security Engine for Trellis
# https://github.com/bild/trellis-crowdsec

# =============================================================================
# Legacy Cleanup: Disable fail2ban and ferm when migrating to CrowdSec
# =============================================================================
- name: Check if fail2ban is installed
  ansible.builtin.stat:
    path: /etc/fail2ban
  register: fail2ban_installed

- name: Stop and disable fail2ban service
  ansible.builtin.service:
    name: fail2ban
    state: stopped
    enabled: false
  when:
    - crowdsec_enabled | bool
    - crowdsec_disable_legacy | default(true)
    - fail2ban_installed.stat.exists
  failed_when: false

- name: Check if ferm is installed
  ansible.builtin.stat:
    path: /etc/ferm
  register: ferm_installed

- name: Stop and disable ferm service
  ansible.builtin.service:
    name: ferm
    state: stopped
    enabled: false
  when:
    - crowdsec_enabled | bool
    - crowdsec_disable_legacy | default(true)
    - ferm_installed.stat.exists
  failed_when: false

- name: Flush ferm iptables rules
  ansible.builtin.command:
    cmd: iptables -F
  when:
    - crowdsec_enabled | bool
    - crowdsec_disable_legacy | default(true)
    - crowdsec_flush_legacy_rules | default(false)
    - ferm_installed.stat.exists
  failed_when: false
  changed_when: true

# =============================================================================
# Package Installation
# =============================================================================
- name: Install CrowdSec prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - gnupg
    state: present
    update_cache: true
  when: crowdsec_enabled | bool

- name: Add CrowdSec GPG key
  ansible.builtin.apt_key:
    url: https://packagecloud.io/crowdsec/crowdsec/gpgkey
    state: present
  when: crowdsec_enabled | bool

- name: Add CrowdSec repository
  ansible.builtin.apt_repository:
    repo: "deb https://packagecloud.io/crowdsec/crowdsec/{{ ansible_distribution | lower }}/ {{ ansible_distribution_release }} main"
    state: present
    filename: crowdsec
  when: crowdsec_enabled | bool

- name: Install CrowdSec
  ansible.builtin.apt:
    name: crowdsec
    state: present
    update_cache: true
  when: crowdsec_enabled | bool
  notify: Restart crowdsec

- name: Ensure CrowdSec service is enabled and started
  ansible.builtin.service:
    name: crowdsec
    enabled: true
    state: started
  when: crowdsec_enabled | bool

- name: Enroll in CrowdSec Console
  ansible.builtin.command:
    cmd: cscli console enroll {{ crowdsec_console_token }}
  when:
    - crowdsec_enabled | bool
    - crowdsec_console_token | length > 0
  register: console_enroll
  changed_when: "'already enrolled' not in console_enroll.stderr"
  failed_when: false

# =============================================================================
# Hub Collections and Scenarios
# =============================================================================
- name: Update CrowdSec hub
  ansible.builtin.command:
    cmd: cscli hub update
  changed_when: false
  when: crowdsec_enabled | bool

- name: Install CrowdSec collections
  ansible.builtin.command:
    cmd: "cscli collections install {{ item }}"
  loop: "{{ crowdsec_collections }}"
  register: collection_install
  changed_when: "'overwrite' not in collection_install.stderr and 'already' not in collection_install.stderr"
  when: crowdsec_enabled | bool

- name: Install additional scenarios
  ansible.builtin.command:
    cmd: "cscli scenarios install {{ item }}"
  loop: "{{ crowdsec_scenarios }}"
  register: scenario_install
  changed_when: "'overwrite' not in scenario_install.stderr and 'already' not in scenario_install.stderr"
  when:
    - crowdsec_enabled | bool
    - crowdsec_scenarios | length > 0

- name: Remove unwanted scenarios
  ansible.builtin.command:
    cmd: "cscli scenarios remove {{ item }} --force"
  loop: "{{ crowdsec_scenarios_remove }}"
  register: scenario_remove
  changed_when: "'Removed' in scenario_remove.stdout or 'removed' in scenario_remove.stdout"
  failed_when: false
  when:
    - crowdsec_enabled | bool
    - crowdsec_scenarios_remove | length > 0
  notify: Reload crowdsec

- name: Install additional parsers
  ansible.builtin.command:
    cmd: "cscli parsers install {{ item }}"
  loop: "{{ crowdsec_parsers }}"
  register: parser_install
  changed_when: "'overwrite' not in parser_install.stderr and 'already' not in parser_install.stderr"
  when:
    - crowdsec_enabled | bool
    - crowdsec_parsers | length > 0
  notify: Reload crowdsec

# =============================================================================
# Log Acquisition
# =============================================================================
- name: Remove default CrowdSec acquisition files
  ansible.builtin.file:
    path: /etc/crowdsec/acquis.d
    state: absent
  notify: Reload crowdsec
  when: crowdsec_enabled | bool

- name: Configure CrowdSec log acquisition
  ansible.builtin.template:
    src: acquis.yaml.j2
    dest: /etc/crowdsec/acquis.yaml
    owner: root
    group: root
    mode: '0644'
  notify: Reload crowdsec
  when: crowdsec_enabled | bool

# =============================================================================
# Profiles (Ban Durations)
# =============================================================================
- name: Configure CrowdSec profiles (ban durations)
  ansible.builtin.template:
    src: profiles.yaml.j2
    dest: /etc/crowdsec/profiles.yaml
    owner: root
    group: root
    mode: '0644'
  notify: Reload crowdsec
  when: crowdsec_enabled | bool

# =============================================================================
# Firewall Bouncer
# =============================================================================
- name: Install CrowdSec Firewall Bouncer
  ansible.builtin.apt:
    name: crowdsec-firewall-bouncer-nftables
    state: present
  register: bouncer_install
  when:
    - crowdsec_enabled | bool
    - crowdsec_firewall_bouncer_enabled | bool

# apt auto-starts the bouncer on first install, but the API key hasn't been
# configured yet so it connects with the wrong credentials. Stop it now and
# let it start cleanly after configuration is complete.
- name: Stop bouncer after fresh install (pre-configuration)
  ansible.builtin.service:
    name: crowdsec-firewall-bouncer
    state: stopped
  when:
    - crowdsec_enabled | bool
    - crowdsec_firewall_bouncer_enabled | bool
    - bouncer_install is changed

- name: Check if firewall bouncer is already registered
  ansible.builtin.command:
    cmd: cscli bouncers list -o raw
  register: bouncer_list
  changed_when: false
  when:
    - crowdsec_enabled | bool
    - crowdsec_firewall_bouncer_enabled | bool

- name: Register firewall bouncer with LAPI
  ansible.builtin.command:
    cmd: cscli bouncers add firewall-bouncer -o raw
  register: bouncer_key
  changed_when: bouncer_key.rc == 0
  failed_when: false
  when:
    - crowdsec_enabled | bool
    - crowdsec_firewall_bouncer_enabled | bool
    - "'firewall-bouncer' not in bouncer_list.stdout"

- name: Configure firewall bouncer API key
  ansible.builtin.lineinfile:
    path: /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml
    regexp: '^api_key:'
    line: "api_key: {{ bouncer_key.stdout }}"
  when:
    - crowdsec_enabled | bool
    - crowdsec_firewall_bouncer_enabled | bool
    - bouncer_key is defined
    - bouncer_key.rc is defined
    - bouncer_key.rc == 0
  notify: Restart crowdsec-firewall-bouncer

- name: Ensure firewall bouncer service is enabled and started
  ansible.builtin.service:
    name: crowdsec-firewall-bouncer
    enabled: true
    state: started
  when:
    - crowdsec_enabled | bool
    - crowdsec_firewall_bouncer_enabled | bool

# Flush handlers now so the bouncer restarts (if notified) before verification.
- name: Flush handlers before bouncer verification
  ansible.builtin.meta: flush_handlers

# Verify the bouncer actually created its nftables sets. Without this check,
# a misconfigured or crashed bouncer is a silent failure — the service shows
# "active" but no traffic is actually blocked.
- name: Wait for bouncer nftables table to appear
  ansible.builtin.command:
    cmd: nft list table ip crowdsec
  register: bouncer_nft_check
  retries: 5
  delay: 2
  until: bouncer_nft_check.rc == 0
  changed_when: false
  failed_when: false
  when:
    - crowdsec_enabled | bool
    - crowdsec_firewall_bouncer_enabled | bool

- name: Warn if bouncer nftables table is missing
  ansible.builtin.fail:
    msg: >-
      CrowdSec firewall bouncer is running but its nftables table (ip crowdsec)
      was not found after 10 seconds. The bouncer is NOT enforcing any decisions.
      Check: journalctl -u crowdsec-firewall-bouncer --no-pager -n 50
  when:
    - crowdsec_enabled | bool
    - crowdsec_firewall_bouncer_enabled | bool
    - bouncer_nft_check.rc is defined
    - bouncer_nft_check.rc != 0

# =============================================================================
# Bouncer Auto-Restart on Agent Restart
# =============================================================================
# When CrowdSec agent restarts (after OOM recovery, update, etc.), the bouncer
# must re-sync its nftables sets. PartOf= tells systemd to restart/stop the
# bouncer whenever the agent is restarted/stopped, avoiding the race condition
# that ExecStartPost caused (double-restart with stale netlink handles).
- name: Create bouncer service override directory
  ansible.builtin.file:
    path: /etc/systemd/system/crowdsec-firewall-bouncer.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - crowdsec_enabled | bool
    - crowdsec_firewall_bouncer_enabled | bool

- name: Bind bouncer lifecycle to agent via PartOf
  ansible.builtin.copy:
    dest: /etc/systemd/system/crowdsec-firewall-bouncer.service.d/partof-crowdsec.conf
    content: |
      [Unit]
      PartOf=crowdsec.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd daemon
  when:
    - crowdsec_enabled | bool
    - crowdsec_firewall_bouncer_enabled | bool

# Clean up legacy ExecStartPost drop-in if present from prior deploys
- name: Remove legacy ExecStartPost drop-in
  ansible.builtin.file:
    path: /etc/systemd/system/crowdsec.service.d/restart-bouncer.conf
    state: absent
  notify: Reload systemd daemon
  when:
    - crowdsec_enabled | bool
    - crowdsec_firewall_bouncer_enabled | bool

# =============================================================================
# IP Whitelists
# =============================================================================
- name: Ensure CrowdSec parser directory exists
  ansible.builtin.file:
    path: /etc/crowdsec/parsers/s02-enrich
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - crowdsec_enabled | bool
    - ip_whitelist | default([]) | length > 0

- name: Configure CrowdSec IP whitelists
  ansible.builtin.template:
    src: whitelists.yaml.j2
    dest: /etc/crowdsec/parsers/s02-enrich/ansible-whitelists.yaml
    owner: root
    group: root
    mode: '0644'
  notify: Reload crowdsec
  when:
    - crowdsec_enabled | bool
    - ip_whitelist | default([]) | length > 0

# =============================================================================
# Blocked IPs Import
# =============================================================================
- name: Import blocked single IPs as CrowdSec decisions
  ansible.builtin.command:
    cmd: >
      cscli decisions add
      --ip "{{ item }}"
      --duration {{ crowdsec_ip_blocklist_duration }}
      --reason "Imported from ip_blocklist"
      --type ban
  loop: "{{ ip_blocklist | default([]) | select('match', '^[0-9.]+$') | list }}"
  register: decision_add_ip
  changed_when: "'already exists' not in decision_add_ip.stderr | default('')"
  failed_when:
    - decision_add_ip.rc != 0
    - "'already exists' not in decision_add_ip.stderr | default('')"
  when:
    - crowdsec_enabled | bool
    - ip_blocklist | default([]) | length > 0

- name: Import blocked CIDR ranges as CrowdSec decisions
  ansible.builtin.command:
    cmd: >
      cscli decisions add
      --range "{{ item }}"
      --duration {{ crowdsec_ip_blocklist_duration }}
      --reason "Imported from ip_blocklist"
      --type ban
  loop: "{{ ip_blocklist | default([]) | select('match', '.*/[0-9]+$') | list }}"
  register: decision_add_range
  changed_when: "'already exists' not in decision_add_range.stderr | default('')"
  failed_when:
    - decision_add_range.rc != 0
    - "'already exists' not in decision_add_range.stderr | default('')"
  when:
    - crowdsec_enabled | bool
    - ip_blocklist | default([]) | length > 0

# =============================================================================
# nftables Blocklist (CIDR Range Enforcement)
# =============================================================================
- name: Ensure nftables.d directory exists
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - crowdsec_enabled | bool
    - crowdsec_nftables_blocklist | bool
    - ip_blocklist | default([]) | length > 0

- name: Deploy nftables blocklist configuration
  ansible.builtin.template:
    src: nftables-blocklist.conf.j2
    dest: /etc/nftables.d/trellis-blocklist.conf
    owner: root
    group: root
    mode: '0644'
  notify: Apply nftables blocklist
  when:
    - crowdsec_enabled | bool
    - crowdsec_nftables_blocklist | bool
    - ip_blocklist | default([]) | length > 0

- name: Remove nftables blocklist when disabled
  ansible.builtin.file:
    path: /etc/nftables.d/trellis-blocklist.conf
    state: absent
  notify: Remove nftables blocklist table
  when:
    - crowdsec_enabled | bool
    - not (crowdsec_nftables_blocklist | bool) or (ip_blocklist | default([]) | length == 0)

- name: Ensure nftables.conf includes nftables.d directory
  ansible.builtin.lineinfile:
    path: /etc/nftables.conf
    line: 'include "/etc/nftables.d/*.conf"'
    create: false
  failed_when: false
  when:
    - crowdsec_enabled | bool
    - crowdsec_nftables_blocklist | bool
    - ip_blocklist | default([]) | length > 0

# =============================================================================
# Custom Scenarios
# =============================================================================
- name: Ensure CrowdSec scenarios directory exists
  ansible.builtin.file:
    path: /etc/crowdsec/scenarios
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - crowdsec_enabled | bool
    - (crowdsec_custom_scenarios | length > 0) or
      (crowdsec_http_probing_exclude_404 | bool) or
      (crowdsec_scenario_actuator_probe | bool) or
      (crowdsec_scenario_debug_fuzzing | bool) or
      (crowdsec_scenario_custom_bad_user_agent | bool) or
      (crowdsec_scenario_ssrf_callback | bool) or
      (crowdsec_scenario_encoded_attack_payload | bool) or
      (crowdsec_scenario_xss_extended | bool) or
      (crowdsec_scenario_cache_buster_probe | bool) or
      (crowdsec_scenario_open_redirect_probe | bool) or
      (crowdsec_scenario_param_stuffing | bool) or
      (crowdsec_scenario_aggressive_crawl | bool) or
      (crowdsec_scenario_sustained_crawl | bool)

- name: Deploy http-probing override (exclude 404)
  ansible.builtin.template:
    src: scenarios/http-probing-no404.yaml.j2
    dest: /etc/crowdsec/scenarios/http-probing.yaml
    owner: root
    group: root
    mode: '0644'
  notify: Reload crowdsec
  when:
    - crowdsec_enabled | bool
    - crowdsec_http_probing_exclude_404 | bool

- name: Remove http-probing override when disabled
  ansible.builtin.file:
    path: /etc/crowdsec/scenarios/http-probing.yaml
    state: absent
  notify: Reload crowdsec
  when:
    - crowdsec_enabled | bool
    - not (crowdsec_http_probing_exclude_404 | bool)

- name: Deploy custom CrowdSec scenarios
  ansible.builtin.template:
    src: scenarios/custom-scenario.yaml.j2
    dest: "/etc/crowdsec/scenarios/{{ item.name }}.yaml"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ crowdsec_custom_scenarios }}"
  notify: Reload crowdsec
  when:
    - crowdsec_enabled | bool
    - crowdsec_custom_scenarios | length > 0

# =============================================================================
# Built-in Scenarios
# =============================================================================
- name: Deploy built-in scenarios
  ansible.builtin.template:
    src: "scenarios/{{ item.template }}.yaml.j2"
    dest: "/etc/crowdsec/scenarios/{{ item.template }}.yaml"
    owner: root
    group: root
    mode: '0644'
  loop:
    - { template: actuator-probe, enabled: "{{ crowdsec_scenario_actuator_probe }}" }
    - { template: debug-fuzzing, enabled: "{{ crowdsec_scenario_debug_fuzzing }}" }
    - { template: custom-bad-user-agent, enabled: "{{ crowdsec_scenario_custom_bad_user_agent }}" }
    - { template: ssrf-callback, enabled: "{{ crowdsec_scenario_ssrf_callback }}" }
    - { template: encoded-attack-payload, enabled: "{{ crowdsec_scenario_encoded_attack_payload }}" }
    - { template: xss-extended, enabled: "{{ crowdsec_scenario_xss_extended }}" }
    - { template: cache-buster-probe, enabled: "{{ crowdsec_scenario_cache_buster_probe }}" }
    - { template: open-redirect-probe, enabled: "{{ crowdsec_scenario_open_redirect_probe }}" }
    - { template: param-stuffing, enabled: "{{ crowdsec_scenario_param_stuffing }}" }
    - { template: aggressive-crawl, enabled: "{{ crowdsec_scenario_aggressive_crawl }}" }
    - { template: sustained-crawl, enabled: "{{ crowdsec_scenario_sustained_crawl }}" }
  loop_control:
    label: "{{ item.template }}"
  notify: Reload crowdsec
  when:
    - crowdsec_enabled | bool
    - item.enabled | bool

- name: Remove disabled built-in scenarios
  ansible.builtin.file:
    path: "/etc/crowdsec/scenarios/{{ item.template }}.yaml"
    state: absent
  loop:
    - { template: actuator-probe, enabled: "{{ crowdsec_scenario_actuator_probe }}" }
    - { template: debug-fuzzing, enabled: "{{ crowdsec_scenario_debug_fuzzing }}" }
    - { template: custom-bad-user-agent, enabled: "{{ crowdsec_scenario_custom_bad_user_agent }}" }
    - { template: ssrf-callback, enabled: "{{ crowdsec_scenario_ssrf_callback }}" }
    - { template: encoded-attack-payload, enabled: "{{ crowdsec_scenario_encoded_attack_payload }}" }
    - { template: xss-extended, enabled: "{{ crowdsec_scenario_xss_extended }}" }
    - { template: cache-buster-probe, enabled: "{{ crowdsec_scenario_cache_buster_probe }}" }
    - { template: open-redirect-probe, enabled: "{{ crowdsec_scenario_open_redirect_probe }}" }
    - { template: param-stuffing, enabled: "{{ crowdsec_scenario_param_stuffing }}" }
    - { template: aggressive-crawl, enabled: "{{ crowdsec_scenario_aggressive_crawl }}" }
    - { template: sustained-crawl, enabled: "{{ crowdsec_scenario_sustained_crawl }}" }
    - { template: bad-user-agent, enabled: false }  # Legacy cleanup
  loop_control:
    label: "{{ item.template }}"
  notify: Reload crowdsec
  when:
    - crowdsec_enabled | bool
    - not (item.enabled | bool)

# =============================================================================
# Web Bouncer (Path B) — port-scoped HTTP-attack ban enforcement
# =============================================================================
# Implements the two-bouncer design: a second firewall-bouncer instance that
# only processes type:web-ban decisions and enforces them with a port-scoped
# nftables drop (tcp dport {80,443} ONLY). The default bouncer continues to
# handle type:ban all-ports for SSH brute-force and manual ip_blocklist.
#
# Architecture (v0.9.5 — empirically validated on bild staging 2026-05-29):
#   - Bouncer runs in set-only mode: writes IPs into pre-created sets in the
#     crowdsec-web table. Does NOT manage rules itself.
#   - nftables-crowdsec-web.conf.j2 owns the table, sets, and port-scoped chain.
#   - ExecStartPre on the bouncer service re-applies the nft template on every
#     (re)start, guaranteeing the table pre-exists before the bouncer connects.
#   - API key is idempotent: existing key extracted from deployed config on each
#     provision; fresh key minted only when the config is absent or key is blank.
#
# Enabled when crowdsec_web_scope_http_bans: true (default).
# Full teardown when crowdsec_web_scope_http_bans: false (no orphaned resources).

# ---------------------------------------------------------------------------
# ENABLE PATH — crowdsec_web_scope_http_bans: true
# ---------------------------------------------------------------------------

# Step 1: Idempotent API key resolution.
# Slurp the existing config (if any) and extract a non-empty api_key.
# Reuse it if found; mint a fresh key if absent or blank.
- name: Slurp existing web bouncer config (key persistence check)
  ansible.builtin.slurp:
    src: /etc/crowdsec/bouncers/crowdsec-firewall-bouncer-web.yaml
  register: web_bouncer_config_slurp
  failed_when: false
  when:
    - crowdsec_enabled | bool
    - crowdsec_firewall_bouncer_enabled | bool
    - crowdsec_web_scope_http_bans | bool

- name: Extract existing web bouncer API key from config
  ansible.builtin.set_fact:
    crowdsec_web_bouncer_api_key: >-
      {{
        (web_bouncer_config_slurp.content | b64decode)
        | regex_search('^api_key:\s+(\S+)', '\1', multiline=True)
        | first
        | default('')
      }}
  when:
    - crowdsec_enabled | bool
    - crowdsec_firewall_bouncer_enabled | bool
    - crowdsec_web_scope_http_bans | bool
    - web_bouncer_config_slurp is not failed
    - web_bouncer_config_slurp.content is defined

- name: Default API key to empty string when config is absent
  ansible.builtin.set_fact:
    crowdsec_web_bouncer_api_key: ''
  when:
    - crowdsec_enabled | bool
    - crowdsec_firewall_bouncer_enabled | bool
    - crowdsec_web_scope_http_bans | bool
    - crowdsec_web_bouncer_api_key is not defined

# Step 2: Mint a fresh key when the existing one is empty.
# Deregister first (idempotent — removes stale registration if present).
- name: Deregister stale web bouncer registration before fresh mint
  ansible.builtin.command:
    cmd: cscli bouncers delete firewall-bouncer-web
  failed_when: false
  changed_when: true
  when:
    - crowdsec_enabled | bool
    - crowdsec_firewall_bouncer_enabled | bool
    - crowdsec_web_scope_http_bans | bool
    - crowdsec_web_bouncer_api_key == ''

- name: Register web firewall bouncer with LAPI (mint fresh key)
  ansible.builtin.command:
    cmd: cscli bouncers add firewall-bouncer-web -o raw
  register: web_bouncer_key_fresh
  changed_when: web_bouncer_key_fresh.rc == 0
  failed_when: web_bouncer_key_fresh.rc != 0
  when:
    - crowdsec_enabled | bool
    - crowdsec_firewall_bouncer_enabled | bool
    - crowdsec_web_scope_http_bans | bool
    - crowdsec_web_bouncer_api_key == ''

- name: Set API key fact from freshly minted key
  ansible.builtin.set_fact:
    crowdsec_web_bouncer_api_key: "{{ web_bouncer_key_fresh.stdout | trim }}"
  when:
    - crowdsec_enabled | bool
    - crowdsec_firewall_bouncer_enabled | bool
    - crowdsec_web_scope_http_bans | bool
    - web_bouncer_key_fresh is defined
    - web_bouncer_key_fresh.rc is defined
    - web_bouncer_key_fresh.rc == 0

# Step 3: Deploy the nft table config.
# This file is also re-applied via ExecStartPre on every bouncer start.
- name: Deploy crowdsec-web nftables table config
  ansible.builtin.template:
    src: nftables-crowdsec-web.conf.j2
    dest: /etc/nftables/crowdsec-web.conf
    owner: root
    group: root
    mode: '0644'
  notify: Apply crowdsec-web nftables
  when:
    - crowdsec_enabled | bool
    - crowdsec_firewall_bouncer_enabled | bool
    - crowdsec_web_scope_http_bans | bool

# Step 4: Deploy web bouncer config — template uses crowdsec_web_bouncer_api_key.
# Never renders a blank api_key because of Steps 1-2 above.
- name: Deploy web bouncer config
  ansible.builtin.template:
    src: crowdsec-firewall-bouncer-web.yaml.j2
    dest: /etc/crowdsec/bouncers/crowdsec-firewall-bouncer-web.yaml
    owner: root
    group: root
    mode: '0600'
  notify: Restart crowdsec-firewall-bouncer-web
  when:
    - crowdsec_enabled | bool
    - crowdsec_firewall_bouncer_enabled | bool
    - crowdsec_web_scope_http_bans | bool

# Step 5: Deploy web bouncer systemd service unit.
# ExecStartPre re-applies the nft table on every (re)start, guaranteeing the
# crowdsec-web table pre-exists before the bouncer connects to LAPI.
# PartOf=crowdsec.service binds lifecycle so the bouncer restarts with the engine.
- name: Deploy web bouncer systemd service unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/crowdsec-firewall-bouncer-web.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=CrowdSec Firewall Bouncer - Web scope (HTTP-attack web-ban decisions)
      Documentation=https://docs.crowdsec.net
      After=crowdsec.service
      PartOf=crowdsec.service

      [Service]
      Type=simple
      ExecStartPre=/usr/sbin/nft -f /etc/nftables/crowdsec-web.conf
      ExecStart=/usr/sbin/crowdsec-firewall-bouncer -c /etc/crowdsec/bouncers/crowdsec-firewall-bouncer-web.yaml
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  notify:
    - Reload systemd daemon
    - Restart crowdsec-firewall-bouncer-web
  when:
    - crowdsec_enabled | bool
    - crowdsec_firewall_bouncer_enabled | bool
    - crowdsec_web_scope_http_bans | bool

# Step 6: Flush handlers so systemd reload + bouncer restart happen before start.
- name: Flush handlers before web bouncer enable
  ansible.builtin.meta: flush_handlers
  when:
    - crowdsec_enabled | bool
    - crowdsec_firewall_bouncer_enabled | bool
    - crowdsec_web_scope_http_bans | bool

# Step 7: Enable and start web bouncer service.
- name: Enable and start web bouncer service
  ansible.builtin.service:
    name: crowdsec-firewall-bouncer-web
    enabled: true
    state: started
  when:
    - crowdsec_enabled | bool
    - crowdsec_firewall_bouncer_enabled | bool
    - crowdsec_web_scope_http_bans | bool

# Step 8: Verify the nft table exists and the service is active.
# Table pre-existence is guaranteed by ExecStartPre; this check confirms
# the bouncer started cleanly (not crashed, not activating-looping).
- name: Flush handlers before web bouncer verification
  ansible.builtin.meta: flush_handlers
  when:
    - crowdsec_enabled | bool
    - crowdsec_firewall_bouncer_enabled | bool
    - crowdsec_web_scope_http_bans | bool

- name: Wait for web bouncer nftables table to appear
  ansible.builtin.command:
    cmd: nft list table ip crowdsec-web
  register: web_bouncer_nft_check
  retries: 5
  delay: 2
  until: web_bouncer_nft_check.rc == 0
  changed_when: false
  failed_when: false
  when:
    - crowdsec_enabled | bool
    - crowdsec_firewall_bouncer_enabled | bool
    - crowdsec_web_scope_http_bans | bool

- name: Warn if web bouncer nftables table is missing
  ansible.builtin.fail:
    msg: >-
      CrowdSec web firewall bouncer is running but its nftables table (ip crowdsec-web)
      was not found after 10 seconds. web-ban decisions are NOT being enforced.
      Check: journalctl -u crowdsec-firewall-bouncer-web --no-pager -n 50
  when:
    - crowdsec_enabled | bool
    - crowdsec_firewall_bouncer_enabled | bool
    - crowdsec_web_scope_http_bans | bool
    - web_bouncer_nft_check.rc is defined
    - web_bouncer_nft_check.rc != 0

- name: Check web bouncer service is active (not crashed)
  ansible.builtin.command:
    cmd: systemctl is-active crowdsec-firewall-bouncer-web
  register: web_bouncer_active_check
  changed_when: false
  failed_when: false
  when:
    - crowdsec_enabled | bool
    - crowdsec_firewall_bouncer_enabled | bool
    - crowdsec_web_scope_http_bans | bool

- name: Warn if web bouncer service is not active
  ansible.builtin.fail:
    msg: >-
      CrowdSec web firewall bouncer service is not active (state: {{ web_bouncer_active_check.stdout | default('unknown') }}).
      The bouncer may have crashed or failed to start. This is likely a config or API key issue.
      Check: journalctl -u crowdsec-firewall-bouncer-web --no-pager -n 50
  when:
    - crowdsec_enabled | bool
    - crowdsec_firewall_bouncer_enabled | bool
    - crowdsec_web_scope_http_bans | bool
    - web_bouncer_active_check.rc is defined
    - web_bouncer_active_check.rc != 0

# ---------------------------------------------------------------------------
# REVERT PATH — crowdsec_web_scope_http_bans: false
# Tear down the web bouncer cleanly: no orphaned service, config, nft table,
# or LAPI registration.
# ---------------------------------------------------------------------------
- name: Stop and disable web bouncer service (revert path)
  ansible.builtin.service:
    name: crowdsec-firewall-bouncer-web
    enabled: false
    state: stopped
  failed_when: false
  when:
    - crowdsec_enabled | bool
    - not (crowdsec_web_scope_http_bans | bool)

- name: Remove web bouncer systemd service unit (revert path)
  ansible.builtin.file:
    path: /etc/systemd/system/crowdsec-firewall-bouncer-web.service
    state: absent
  notify: Reload systemd daemon
  when:
    - crowdsec_enabled | bool
    - not (crowdsec_web_scope_http_bans | bool)

- name: Remove web bouncer config file (revert path)
  ansible.builtin.file:
    path: /etc/crowdsec/bouncers/crowdsec-firewall-bouncer-web.yaml
    state: absent
  when:
    - crowdsec_enabled | bool
    - not (crowdsec_web_scope_http_bans | bool)

- name: Remove crowdsec-web nftables config file (revert path)
  ansible.builtin.file:
    path: /etc/nftables/crowdsec-web.conf
    state: absent
  when:
    - crowdsec_enabled | bool
    - not (crowdsec_web_scope_http_bans | bool)

- name: Deregister web bouncer from LAPI (revert path)
  ansible.builtin.command:
    cmd: cscli bouncers delete firewall-bouncer-web
  failed_when: false
  changed_when: true
  when:
    - crowdsec_enabled | bool
    - not (crowdsec_web_scope_http_bans | bool)

- name: Remove web bouncer nftables table ipv4 (revert path)
  ansible.builtin.command:
    cmd: nft delete table ip crowdsec-web
  failed_when: false
  changed_when: true
  when:
    - crowdsec_enabled | bool
    - not (crowdsec_web_scope_http_bans | bool)

- name: Remove web bouncer nftables table ipv6 (revert path)
  ansible.builtin.command:
    cmd: nft delete table ip6 crowdsec-web
  failed_when: false
  changed_when: true
  when:
    - crowdsec_enabled | bool
    - not (crowdsec_web_scope_http_bans | bool)
