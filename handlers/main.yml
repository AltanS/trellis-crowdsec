---
- name: Reload crowdsec
  ansible.builtin.service:
    name: crowdsec
    state: reloaded

- name: Restart crowdsec
  ansible.builtin.service:
    name: crowdsec
    state: restarted

- name: Restart crowdsec-firewall-bouncer
  ansible.builtin.service:
    name: crowdsec-firewall-bouncer
    state: restarted

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Apply nftables blocklist
  ansible.builtin.command:
    cmd: nft -f /etc/nftables.d/trellis-blocklist.conf
  changed_when: true

- name: Remove nftables blocklist table
  ansible.builtin.command:
    cmd: nft delete table inet trellis_blocklist
  failed_when: false
  changed_when: true

# Restart the oneshot loader BEFORE the web bouncer.
# Ansible runs handlers in definition order — this handler must be defined
# before Restart crowdsec-firewall-bouncer-web so that when both are notified
# (e.g. by the nft template task), the table is re-laid first and the bouncer
# re-attaches to the fresh table cleanly. Re-laying under a running bouncer
# breaks its netlink handle (bug 6, v0.9.5).
- name: Restart crowdsec-web-nftables
  ansible.builtin.service:
    name: crowdsec-web-nftables
    state: restarted

- name: Restart crowdsec-firewall-bouncer-web
  ansible.builtin.service:
    name: crowdsec-firewall-bouncer-web
    state: restarted
